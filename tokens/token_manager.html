<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoW Token Manager</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #1a1a2e;
            color: #eee;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        h1 {
            text-align: center;
            color: #fff;
            margin-bottom: 10px;
        }

        .stats {
            text-align: center;
            margin-bottom: 20px;
            color: #888;
        }

        .stats span {
            margin: 0 15px;
        }

        .stats .done {
            color: #4ade80;
        }

        .stats .pending {
            color: #f59e0b;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .controls button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .controls button.primary {
            background: #3b82f6;
            color: white;
        }

        .controls button.primary:hover {
            background: #2563eb;
        }

        .controls button.secondary {
            background: #4b5563;
            color: white;
        }

        .controls button.secondary:hover {
            background: #374151;
        }

        .filter-tabs {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-bottom: 20px;
        }

        .filter-tabs button {
            padding: 8px 16px;
            border: 2px solid #4b5563;
            background: transparent;
            color: #9ca3af;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-tabs button.active {
            border-color: #3b82f6;
            color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
        }

        .filter-tabs button:hover {
            border-color: #6b7280;
            color: #d1d5db;
        }

        .token-list {
            max-width: 900px;
            margin: 0 auto;
        }

        .token-card {
            background: #16213e;
            border-radius: 10px;
            padding: 15px 20px;
            margin-bottom: 10px;
            border-left: 4px solid #f59e0b;
            transition: all 0.2s;
        }

        .token-card.done {
            border-left-color: #4ade80;
            opacity: 0.7;
        }

        .token-card:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .token-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        .token-id {
            font-weight: bold;
            color: #3b82f6;
            font-size: 12px;
            background: rgba(59, 130, 246, 0.2);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .token-name {
            font-size: 16px;
            font-weight: 600;
            flex: 1;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-wrapper input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #4ade80;
        }

        .checkbox-wrapper label {
            font-size: 13px;
            color: #9ca3af;
            cursor: pointer;
        }

        .token-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 8px;
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: 10px;
        }

        .token-details span {
            background: rgba(255,255,255,0.05);
            padding: 4px 8px;
            border-radius: 4px;
        }

        .token-details .label {
            color: #6b7280;
        }

        .effect-text {
            font-size: 12px;
            color: #f59e0b;
            background: rgba(245, 158, 11, 0.1);
            padding: 8px;
            border-radius: 5px;
            margin-bottom: 10px;
            font-style: italic;
        }

        .image-input-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .image-input-wrapper input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #4b5563;
            border-radius: 5px;
            background: #0f0f23;
            color: #fff;
            font-size: 13px;
        }

        .image-input-wrapper input:focus {
            outline: none;
            border-color: #3b82f6;
        }

        .image-input-wrapper input::placeholder {
            color: #6b7280;
        }

        .image-preview {
            width: 60px;
            height: 84px;
            border-radius: 5px;
            object-fit: cover;
            border: 1px solid #4b5563;
        }

        .created-by {
            font-size: 11px;
            color: #6b7280;
            margin-top: 8px;
        }

        .created-by a {
            color: #60a5fa;
            text-decoration: none;
            transition: color 0.2s;
        }

        .created-by a:hover {
            color: #93c5fd;
            text-decoration: underline;
        }

        .hidden {
            display: none !important;
        }

        .export-area {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .export-modal {
            background: #16213e;
            padding: 20px;
            border-radius: 10px;
            max-width: 600px;
            width: 90%;
        }

        .export-modal textarea {
            width: 100%;
            height: 300px;
            background: #0f0f23;
            color: #fff;
            border: 1px solid #4b5563;
            border-radius: 5px;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            resize: vertical;
        }

        .export-modal .buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            justify-content: flex-end;
        }
    </style>
</head>
<body>
    <h1>Force of Will - Token Manager</h1>

    <div class="stats">
        <span class="done">Created: <strong id="done-count">0</strong></span>
        <span class="pending">Pending: <strong id="pending-count">0</strong></span>
        <span>Total: <strong id="total-count">0</strong></span>
    </div>

    <div class="controls">
        <button class="primary" onclick="exportJSON()">Export JSON</button>
        <button class="secondary" onclick="document.getElementById('import-file').click()">Import JSON</button>
        <input type="file" id="import-file" accept=".json" onchange="importJSON(event)" style="display:none">
        <button class="secondary" onclick="saveToLocalStorage()">Save Progress</button>
    </div>

    <div class="filter-tabs">
        <button class="active" onclick="filterTokens('all', this)">All</button>
        <button onclick="filterTokens('pending', this)">Pending</button>
        <button onclick="filterTokens('done', this)">Created</button>
    </div>

    <div class="token-list" id="token-list"></div>

    <div class="export-area hidden" id="export-area">
        <div class="export-modal">
            <h3>Export Token Data</h3>
            <textarea id="export-text" readonly></textarea>
            <div class="buttons">
                <button class="secondary" onclick="copyToClipboard()">Copy to Clipboard</button>
                <button class="secondary" onclick="downloadJSON()">Download</button>
                <button class="primary" onclick="closeExport()">Close</button>
            </div>
        </div>
    </div>

    <script>
        let tokens = [];
        let currentFilter = 'all';
        const FOW_BASE_URL = 'https://www.forceofwind.online/card/';

        function formatCreatedBy(createdBy) {
            if (!createdBy || createdBy.length === 0) return '';

            return createdBy.map(card => {
                // Handle both old format (string) and new format (object with id/name)
                if (typeof card === 'string') {
                    return card;
                } else if (card.id && card.name) {
                    const url = FOW_BASE_URL + encodeURIComponent(card.id) + '/';
                    return `<a href="${url}" target="_blank" title="${card.id}">${card.name}</a>`;
                }
                return '';
            }).join(', ');
        }

        // Load tokens from localStorage or fetch from file
        async function init() {
            const saved = localStorage.getItem('fow-tokens');
            if (saved) {
                tokens = JSON.parse(saved);
            } else {
                try {
                    const response = await fetch('token_summary.json');
                    tokens = await response.json();
                } catch (e) {
                    console.error('Could not load token_summary.json:', e);
                    tokens = [];
                }
            }
            renderTokens();
            updateStats();
        }

        function renderTokens() {
            const list = document.getElementById('token-list');
            list.innerHTML = '';

            tokens.forEach((token, index) => {
                const isVisible = currentFilter === 'all' ||
                    (currentFilter === 'done' && token.created) ||
                    (currentFilter === 'pending' && !token.created);

                const card = document.createElement('div');
                card.className = `token-card ${token.created ? 'done' : ''} ${isVisible ? '' : 'hidden'}`;
                card.innerHTML = `
                    <div class="token-header">
                        <span class="token-id">${token.id}</span>
                        <span class="token-name">${token.name}</span>
                        <div class="checkbox-wrapper">
                            <input type="checkbox" id="check-${index}" ${token.created ? 'checked' : ''} onchange="toggleCreated(${index})">
                            <label for="check-${index}">created</label>
                        </div>
                    </div>
                    <div class="token-details">
                        <span><span class="label">Stats:</span> ${token.stats}</span>
                        <span><span class="label">Color:</span> ${token.attribute}</span>
                        <span><span class="label">Race:</span> ${token.race}</span>
                        <span><span class="label">Set:</span> ${token.first_set}</span>
                    </div>
                    ${token.effect ? `<div class="effect-text">${token.effect}</div>` : ''}
                    <div class="image-input-wrapper">
                        ${token.image_url ? `<img src="${token.image_url}" class="image-preview" onerror="this.style.display='none'">` : ''}
                        <input type="text" placeholder="Enter image URL..." value="${token.image_url || ''}" onchange="updateImageUrl(${index}, this.value)">
                    </div>
                    <div class="created-by">Created by: ${formatCreatedBy(token.created_by)}</div>
                `;
                list.appendChild(card);
            });
        }

        function toggleCreated(index) {
            tokens[index].created = !tokens[index].created;
            saveToLocalStorage();
            renderTokens();
            updateStats();
        }

        function updateImageUrl(index, url) {
            tokens[index].image_url = url;
            saveToLocalStorage();
            renderTokens();
        }

        function updateStats() {
            const done = tokens.filter(t => t.created).length;
            const pending = tokens.length - done;
            document.getElementById('done-count').textContent = done;
            document.getElementById('pending-count').textContent = pending;
            document.getElementById('total-count').textContent = tokens.length;
        }

        function filterTokens(filter, btn) {
            currentFilter = filter;
            document.querySelectorAll('.filter-tabs button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderTokens();
        }

        function saveToLocalStorage() {
            localStorage.setItem('fow-tokens', JSON.stringify(tokens));
        }

        function exportJSON() {
            document.getElementById('export-text').value = JSON.stringify(tokens, null, 2);
            document.getElementById('export-area').classList.remove('hidden');
        }

        function closeExport() {
            document.getElementById('export-area').classList.add('hidden');
        }

        function copyToClipboard() {
            const text = document.getElementById('export-text');
            text.select();
            document.execCommand('copy');
            alert('Copied to clipboard!');
        }

        function downloadJSON() {
            const blob = new Blob([JSON.stringify(tokens, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'token_summary.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    tokens = JSON.parse(e.target.result);
                    saveToLocalStorage();
                    renderTokens();
                    updateStats();
                    alert('Imported successfully!');
                } catch (err) {
                    alert('Error parsing JSON file');
                }
            };
            reader.readAsText(file);
        }

        // Initialize
        init();
    </script>
</body>
</html>
